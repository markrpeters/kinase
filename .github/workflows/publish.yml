name: publish

# Tag v* -> gates -> pack the tarball for review -> stage to npm from the
# `npm` environment, which holds a required reviewer, so the stage job waits
# for a manual approval on GitHub. The trusted publisher on npmjs.com allows
# `npm stage publish` only: the version lands in npm's staging area, and a
# maintainer approves it on npmjs.com with 2FA after inspecting the staged
# tarball (`npm stage download`). Authentication is the OIDC id-token; no
# npm token exists anywhere. Provenance is attached to every publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Tag must equal package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          [ "$PKG" = "$TAG" ] || { echo "package.json $PKG != tag $TAG"; exit 1; }
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - name: Identifier-safety scan (fails on any HIGH/MED hit)
        env:
          IP_SCAN_PRIVATE_TERMS: ${{ secrets.IP_SCAN_PRIVATE_TERMS }}
        run: bash scripts/ip_scan.sh . scan-out
      - run: bash scripts/ip_scan_selftest.sh
      - name: Pack the tarball the reviewer inspects
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          sha256sum dist/*.tgz | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or later (trusted publishing floor)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Stage to npm with provenance
        # npm pack is reproducible at the tar layer for the same tree. The
        # reviewer downloads the staged tarball and compares
        # `gzip -dc | sha256sum` with the build job's artifact before approving
        # on npmjs.com.
        run: npm stage publish --access public --provenance
